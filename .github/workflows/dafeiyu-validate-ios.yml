name: Dafeiyu full project checks and unsigned iOS build

on:
  push:
    branches: ['dfy/**']
  workflow_call:
    inputs:
      build_ios:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      package_existing_archive:
        description: Package only the verified V0.7 archive from Run 40282200498; no rebuild or signing
        type: boolean
        default: false
      refresh_pods:
        description: Regenerate native dependency lock on macOS, then verify deployment installation
        type: boolean
        default: false
      build_ios:
        description: Attempt unsigned device archive after full project checks
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: dafeiyu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ inputs.package_existing_archive != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
          persist-credentials: false
          fetch-depth: 0
      - uses: ./custom/.github/actions/dafeiyu-source
      - name: Run preparation unit tests (fixtures, NOT a full build)
        working-directory: custom
        run: |
          python3 scripts/test-source-integrity.py
          python3 scripts/test-offline-preparation.py
          python3 scripts/test-local-ios.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - run: npm install --global yarn@1.22.22
      - name: Protocol tests with in-process service double (NOT phone tests)
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-memory-core.cjs 2>&1 | tee "$RUNNER_TEMP/protocol.log"
      - name: Install frozen JavaScript dependencies on CLOUD only
        id: install
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --non-interactive 2>&1 | tee "$RUNNER_TEMP/yarn-install.log"
          git diff --exit-code -- yarn.lock
      - name: Full project TypeScript
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          yarn typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Full project ESLint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          yarn lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: Full upstream Jest suite including memory integration
        id: jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          yarn test --runInBand --coverage=false 2>&1 | tee "$RUNNER_TEMP/jest.log"
      - name: Record actual check outcomes
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          JEST: ${{ steps.jest.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {key: os.environ.get(key) for key in ['INSTALL', 'TYPECHECK', 'LINT', 'JEST']}
          result.update(commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], iphone_tested=False)
          Path(os.environ['RUNNER_TEMP'], 'check-outcomes.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Upload actual logs, outcomes and source patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-full-project-checks
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/check-outcomes.json
            ${{ runner.temp }}/dafeiyu-integration.patch
          if-no-files-found: error
          retention-days: 7

  unsigned-ios:
    if: ${{ inputs.package_existing_archive != true && (github.event_name == 'push' || inputs.build_ios) }}
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
          persist-credentials: false
          fetch-depth: 0
      - uses: ./custom/.github/actions/dafeiyu-source
      - name: Record actual Xcode and iPhoneOS SDK
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$RUNNER_TEMP/xcode-version.log"
      - name: Require Xcode 26.6
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Prepare independent local configuration (no upstream cloud credentials)
        working-directory: upstream
        run: python3 scripts/prepare-ios-config.py --local
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - run: npm install --global yarn@1.22.22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          working-directory: upstream
          bundler-cache: true
      - name: Install frozen JS dependencies on macOS
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          yarn install --frozen-lockfile --non-interactive 2>&1 | tee "$RUNNER_TEMP/ios-yarn-install.log"
          git diff --exit-code -- yarn.lock
      - name: Regenerate native lock on macOS when explicitly requested
        if: ${{ inputs.refresh_pods == true }}
        working-directory: upstream/ios
        shell: bash
        run: |
          set -euo pipefail
          bundle exec pod install 2>&1 | tee "$RUNNER_TEMP/pod-refresh.log"
          cp Podfile.lock "$RUNNER_TEMP/Podfile.lock"
          python3 - <<'PYLOCK'
          import base64, gzip
          from pathlib import Path
          print('POD_LOCK_GZIP_BASE64=' + base64.b64encode(gzip.compress(Path('Podfile.lock').read_bytes(), mtime=0)).decode())
          PYLOCK
      - name: Install locked native dependencies
        working-directory: upstream/ios
        shell: bash
        run: |
          set -o pipefail
          bundle exec pod install --deployment 2>&1 | tee "$RUNNER_TEMP/pod-install.log"
          # A refresh run exports its real generated lock for the follow-up commit.
          # Normal builds must use exactly the reviewed committed lock.
          if [ "${{ inputs.refresh_pods }}" != 'true' ]; then
            git diff --exit-code -- Podfile.lock
          fi
      - name: Build unsigned device archive (NOT an installable IPA)
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          # Keep complete compiler output as an artifact, with bounded console
          # diagnostics so failures can also be retrieved through the Jobs API.
          if xcodebuild archive \
            -jobs 2 \
            -workspace ios/PocketPal.xcworkspace \
            -scheme PocketPal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dafeiyu-unsigned.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/Dafeiyu-unsigned.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            > "$RUNNER_TEMP/dafeiyu-unsigned-build.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/dafeiyu-unsigned-build.log"
          else
            status=$?
            grep -n -B 5 -A 8 -E 'error:|fatal error:|ARCHIVE FAILED' "$RUNNER_TEMP/dafeiyu-unsigned-build.log" | tail -n 200 || true
            tail -n 60 "$RUNNER_TEMP/dafeiyu-unsigned-build.log"
            exit "$status"
          fi
          test -d "$RUNNER_TEMP/Dafeiyu-unsigned.xcarchive/Products/Applications/PocketPal.app"
          printf '%s\n' 'UNSIGNED ARCHIVE. Cannot install on iPhone. No IPA exported.' > "$RUNNER_TEMP/UNSIGNED-README.txt"
          ditto -c -k --keepParent "$RUNNER_TEMP/Dafeiyu-unsigned.xcarchive" "$RUNNER_TEMP/Dafeiyu-unsigned.xcarchive.zip"
      - name: Upload unsigned archive only after successful xcodebuild
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-UNSIGNED-device-archive-NOT-INSTALLABLE
          path: |
            ${{ runner.temp }}/Dafeiyu-unsigned.xcarchive.zip
            ${{ runner.temp }}/UNSIGNED-README.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload actual native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-native-build-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/Podfile.lock
            ${{ runner.temp }}/Dafeiyu-unsigned.xcresult
          if-no-files-found: ignore
          retention-days: 7

  package-existing-archive:
    if: ${{ inputs.package_existing_archive == true }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: packager
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 309495851662142935f25b34a9eab8d0c96d25fe
          path: source
          persist-credentials: false
      - name: Verify source run identity and actual archive artifact
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: 40282200498})).data;
            if (run.conclusion !== 'success' || run.head_sha !== '309495851662142935f25b34a9eab8d0c96d25fe') {
              throw new Error('Source run is not the verified successful V0.7 build');
            }
            const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: 40282200498})).data.artifacts;
            const archive = artifacts.find(a => a.id === 12633329365 && a.name === 'dafeiyu-UNSIGNED-device-archive-NOT-INSTALLABLE');
            if (!archive || archive.expired) throw new Error('Verified source archive is missing or expired');
            core.info(JSON.stringify({source_run: run.id, source_sha: run.head_sha, artifact_id: archive.id, digest: archive.digest}));
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-UNSIGNED-device-archive-NOT-INSTALLABLE
          run-id: 40282200498
          github-token: ${{ github.token }}
          path: archive-input
      - name: Inspect and package complete app without signing or changing it
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          python3 packager/scripts/package-existing-ipa.py \
            --archive-zip archive-input/Dafeiyu-unsigned.xcarchive.zip \
            --entitlements source/ios/PocketPal/PocketPal.entitlements \
            --output "$RUNNER_TEMP/unsigned-ipa"
          cp packager/docs/WINDOWS_SIDELOADLY_ZH.md "$RUNNER_TEMP/unsigned-ipa/"
      - name: Upload unsigned IPA and inspection records (NOT directly installable)
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-v07-UNSIGNED-IPA-REQUIRES-RESIGNING
          path: ${{ runner.temp }}/unsigned-ipa/
          if-no-files-found: error
          retention-days: 14
